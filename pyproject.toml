[project]
name = "drawing-pdf-renamer"
version = "0.1.1"
description = "Semi-automatic engineering drawing PDF renamer"
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.11.1",
    "PyMuPDF==1.28.0",
    "Pillow==12.3.0",
    "numpy==2.3.5",
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
release = ["pyinstaller==6.16.0"]

[project.scripts]
drawing-renamer = "drawing_renamer.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
