[project]
name = "drawing-pdf-renamer"
version = "0.1.0"
description = "Semi-automatic engineering drawing PDF renamer"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
    "PyMuPDF>=1.25",
    "Pillow>=11",
    "numpy>=2",
    "paddleocr>=3.0",
    "paddlepaddle>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
drawing-renamer = "drawing_renamer.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
